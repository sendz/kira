name: Flatpak

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04 # pinned so the ubuntu-latest migration doesn't move CI
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.sendyyeah.Kira.json
          bundle: com.sendyyeah.Kira.flatpak
          run-tests: true
          # TODO: Enable it later after stable
          # repository-name: flathub
          # repository-url: https://flathub.org/repo/flathub.flatpakrepo
          artifact-name: com.sendyyeah.Kira.flatpak

  release:
    name: Publish release
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "${{ github.run_id }}" --name com.sendyyeah.Kira.flatpak --dir dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          bundle="dist/com.sendyyeah.Kira.flatpak"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" --clobber
          else
            gh release create "$tag" "$bundle" --title "$tag" --generate-notes
          fi
