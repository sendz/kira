name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.sendyyeah.Kira.json
          bundle: com.sendyyeah.Kira.flatpak
          run-tests: true
          # TODO: Enable it later after stable
          # repository-name: flathub
          # repository-url: https://flathub.org/repo/flathub.flatpakrepo
          artifact-name: com.sendyyeah.Kira.flatpak
